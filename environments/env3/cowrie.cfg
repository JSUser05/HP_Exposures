# ============================================================================
# Environment Profile: env3 (Cloud Deployment Node)
# ============================================================================

[honeypot]
hostname = ip-172-31-18-42
sensor_name = cloud-deploy-01
timezone = UTC
contents_path = ../environments/env3/honeyfs
idle_timeout = 180
authentication_timeout = 120

[shell]
filesystem = ../custom_fs3.pickle
arch = linux-x64-lsb
kernel_version = 6.5.0-1016-aws
kernel_build_string = #16~22.04.1-Ubuntu SMP Fri Mar  8 18:14:00 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.6, OpenSSL 3.0.2 15 Mar 2022

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
forwarding = true
auth_none_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false
