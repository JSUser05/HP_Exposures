# ============================================================================
# Environment Profile: env2 (Student Lab / Dev Desktop)
# ============================================================================

[honeypot]
hostname = student-lab
sensor_name = student-lab-01
timezone = America/Chicago
contents_path = ../environments/env2/honeyfs
idle_timeout = 180
authentication_timeout = 120

[shell]
filesystem = ../custom_fs2.pickle
arch = linux-x64-lsb
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1 (2024-05-03)
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.11 19 Sep 2023

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
forwarding = true
auth_none_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false
