# ============================================================================
# Environment Profile: env1 (Staging Web API Server)
# ============================================================================

[honeypot]
hostname = staging-api
sensor_name = staging-api-01
timezone = America/Chicago
contents_path = ../environments/env1/honeyfs
idle_timeout = 180
authentication_timeout = 120

[shell]
filesystem = ../custom_fs1.pickle
arch = linux-x64-lsb
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.10, OpenSSL 3.0.2 15 Mar 2022

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
forwarding = true
auth_none_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false
