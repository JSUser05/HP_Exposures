# ============================================================================
# Environment Profile: env4 (Personal Linux Home / Media Server)
# ============================================================================

[honeypot]
hostname = home-server
sensor_name = home-nas-01
timezone = America/Chicago
contents_path = ../environments/env4/honeyfs
idle_timeout = 180
authentication_timeout = 120

[shell]
filesystem = ../custom_fs4.pickle
arch = linux-x64-lsb
kernel_version = 6.5.0-26-generic
kernel_build_string = #26~22.04.1-Ubuntu SMP PREEMPT_DYNAMIC Tue Mar 12 10:22:43 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.6, OpenSSL 3.0.2 15 Mar 2022

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
forwarding = true
auth_none_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false
